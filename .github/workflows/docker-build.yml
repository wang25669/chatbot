name: Build and Push Multi-Arch Docker Image

# 触发条件：当代码推送到 main 分支时自动触发
on:
  push:
    branches: [main]
    workflow_dispatch:

# 权限设置：允许工作流推送镜像到 GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的项目代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 QEMU（这是支持多架构编译的核心组件）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx（高级构建工具）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 自动登录到 GitHub 容器镜像仓库 (ghcr.io)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 将仓库名转换为小写（Docker 镜像名称必须是小写）
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      # 6. 构建并推送 x86 和 arm64 两个架构的镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 关键点：在这里声明需要同时编译的两个架构
          platforms: linux/amd64,linux/arm64 
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
